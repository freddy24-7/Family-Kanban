# Local development database, same major version as production (Railway pgvector, PG 18).
# Host port 5433 avoids clashing with a local Postgres.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: famkanban
      POSTGRES_PASSWORD: famkanban
      POSTGRES_DB: famkanban
    ports:
      - "5433:5432"
    volumes:
      # PG 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famkanban"]
      interval: 5s
      retries: 10

volumes:
  pgdata18:
